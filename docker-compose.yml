services:
  slanko-db:
    image: mysql:8.4
    container_name: slanko-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: slanko
      MYSQL_USER: slanko
      MYSQL_PASSWORD: slanko
    volumes:
      - slanko_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  slanko_mysql_data:
