services:
  slanko-db:
    image: mysql:8.4
    container_name: slanko-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: slanko
      MYSQL_USER: slanko
      MYSQL_PASSWORD: slanko
    volumes:
      - slanko_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # App empacotada (perfil "app"): docker compose --profile app up -d --build
  # Fora do perfil, `npm run db:up` continua subindo só banco e monitoramento.
  slanko-app:
    build: .
    container_name: slanko-app
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      slanko-db:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: mysql://slanko:slanko@slanko-db:3306/slanko
      # Lido do .env da raiz (o compose carrega esse arquivo automaticamente).
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      METRICS_TOKEN: ${METRICS_TOKEN:-slanko-local-metrics-token}
    volumes:
      - slanko_uploads:/app/uploads

  slanko-prometheus:
    image: prom/prometheus:v2.55.1
    container_name: slanko-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - slanko_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  slanko-grafana:
    image: grafana/grafana:11.2.2
    container_name: slanko-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: slanko
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - slanko_grafana_data:/var/lib/grafana
    depends_on:
      - slanko-prometheus

volumes:
  slanko_uploads:
  slanko_mysql_data:
  slanko_prometheus_data:
  slanko_grafana_data:
