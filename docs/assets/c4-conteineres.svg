<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 920" width="1480" height="920" role="img">
  <title>C4 Nível 2 - Diagrama de Contêineres - Slanko</title>
  <desc>Contêineres do Slanko no docker compose: slanko-app, slanko-db, volume de anexos, Prometheus e Grafana; GitHub Actions e SonarCloud como sistemas externos.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1480" height="920" fill="#ffffff"/>
  <text x="40" y="34" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">C4 Nível 2 - Contêineres | Slanko</text>

  <!-- Sistemas externos (acima da fronteira) -->
  <rect x="480" y="60" width="280" height="140" rx="8" fill="#999999"/>
  <text x="620.0" y="103.5" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">GitHub Actions</text>
  <text x="620.0" y="123.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Sistema externo: CI]</text>
  <text x="620.0" y="149.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Lint, typecheck, testes com</text>
  <text x="620.0" y="171.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">cobertura, build e integração MySQL</text>
  <rect x="920" y="60" width="280" height="140" rx="8" fill="#999999"/>
  <text x="1060.0" y="114.5" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">SonarCloud</text>
  <text x="1060.0" y="134.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Sistema externo: SaaS]</text>
  <text x="1060.0" y="160.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Quality Gate e cobertura</text>

  <!-- Pessoas -->
  <rect x="30" y="330" width="170" height="80" rx="8" fill="#08427b"/>
  <text x="115.0" y="367.0" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gestor</text>
  <text x="115.0" y="387.0" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Pessoa]</text>
  <rect x="30" y="450" width="170" height="80" rx="8" fill="#08427b"/>
  <text x="115.0" y="487.0" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Técnico</text>
  <text x="115.0" y="507.0" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Pessoa]</text>

  <!-- Fronteira -->
  <rect x="280" y="250" width="1160" height="580" rx="10" fill="#eef6fc" stroke="#1168bd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="300" y="278" fill="#1168bd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Slanko (docker compose)</text>

  <rect x="320" y="300" width="560" height="250" rx="8" fill="#438dd5"/>
  <text x="600.0" y="365.5" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">slanko-app</text>
  <text x="600.0" y="385.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Container: Next.js 15 / TypeScript / React]</text>
  <text x="600.0" y="411.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Interface React e API REST (rotas Next.js)</text>
  <text x="600.0" y="433.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Middleware: JWT, perfil atual no banco e CSP com nonce</text>
  <text x="600.0" y="455.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Services: chamados, SLA, rentabilidade, equipe e histórico</text>
  <text x="600.0" y="477.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Repositories + Prisma</text>
  <text x="600.0" y="499.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">/api/metrics para o Prometheus</text>
  <rect x="320" y="650" width="280" height="140" rx="8" fill="#2e7d32"/>
  <text x="460.0" y="693.5" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">slanko-db</text>
  <text x="460.0" y="713.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Container: MySQL 8.4]</text>
  <text x="460.0" y="739.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Contratos, chamados, horas,</text>
  <text x="460.0" y="761.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">usuários e histórico de eventos</text>
  <rect x="640" y="650" width="240" height="140" rx="8" fill="#5b8cc0"/>
  <text x="760.0" y="693.5" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">uploads</text>
  <text x="760.0" y="713.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Volume Docker]</text>
  <text x="760.0" y="739.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Anexos dos chamados</text>
  <text x="760.0" y="761.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">(imagens e vídeos)</text>
  <rect x="1080" y="300" width="320" height="130" rx="8" fill="#6b7280"/>
  <text x="1240.0" y="349.5" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">slanko-prometheus</text>
  <text x="1240.0" y="369.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Container: Prometheus]</text>
  <text x="1240.0" y="395.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Coleta e guarda as séries</text>
  <rect x="1080" y="520" width="320" height="130" rx="8" fill="#6b7280"/>
  <text x="1240.0" y="569.5" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">slanko-grafana</text>
  <text x="1240.0" y="589.5" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Container: Grafana]</text>
  <text x="1240.0" y="615.5" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Painel Slanko Overview</text>

  <!-- Relações (rótulos fora das linhas) -->
  <line x1="200" y1="370" x2="318" y2="370" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="240" y="360" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">HTTPS</text>
  <line x1="200" y1="490" x2="318" y2="490" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="240" y="480" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">HTTPS</text>
  <line x1="460" y1="550" x2="460" y2="648" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="472" y="604" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11">SQL via Prisma</text>
  <line x1="760" y1="550" x2="760" y2="648" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="772" y="604" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11">Lê e grava arquivos</text>
  <line x1="1080" y1="365" x2="882" y2="365" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="980" y="352" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">GET /api/metrics</text>
  <text x="980" y="384" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="10" text-anchor="middle">a cada 15 s, com token</text>
  <line x1="1240" y1="520" x2="1240" y2="432" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1252" y="480" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11">Consulta (PromQL)</text>
  <line x1="760" y1="130" x2="918" y2="130" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="840" y="118" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Análise e cobertura</text>
  <line x1="620" y1="200" x2="620" y2="298" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="632" y="232" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11">Testa e faz o build do código</text>

  <text x="280" y="866" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-style="italic">npm run db:up sobe slanko-db, slanko-prometheus e slanko-grafana; o slanko-app sobe no perfil app (npm run app:up).</text>
  <text x="280" y="886" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-style="italic">Arquitetura em camadas: apresentação, aplicação, dados e infraestrutura.</text>
</svg>
