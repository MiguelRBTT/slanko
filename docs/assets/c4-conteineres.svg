  <rect x="360" y="460" width="360" height="150" rx="8" fill="#2e7d32"/>
  <text x="540" y="500" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">slanko-db</text>
  <text x="540" y="525" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Container: MySQL]</text>
  <text x="540" y="555" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Contratos, chamados, horas,</text>
  <text x="540" y="575" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">usu&#225;rios e metas de SLA</text>

  <!-- Externos -->
  <rect x="920" y="110" width="300" height="110" rx="8" fill="#999999"/>
  <text x="1070" y="150" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">GitHub Actions</text>
  <text x="1070" y="174" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Container / Pipeline]</text>
  <text x="1070" y="200" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">CI: lint, testes, build</text>

  <rect x="920" y="260" width="300" height="110" rx="8" fill="#999999"/>
  <text x="1070" y="300" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">SonarCloud</text>
  <text x="1070" y="324" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[SaaS]</text>
  <text x="1070" y="350" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Qualidade e seguran&#231;a</text>

  <rect x="920" y="410" width="300" height="110" rx="8" fill="#999999"/>
  <text x="1070" y="450" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Grafana / Prometheus</text>
  <text x="1070" y="474" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Monitoramento]</text>
  <text x="1070" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">M&#233;tricas da aplica&#231;&#227;o</text>

  <!-- Relacoes -->
  <line x1="200" y1="210" x2="300" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="198" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">HTTPS / UI</text>

  <line x1="200" y1="340" x2="300" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="335" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">HTTPS / UI</text>

  <line x1="540" y1="400" x2="540" y2="460" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="615" y="435" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">SQL via Prisma</text>

  <line x1="780" y1="200" x2="920" y2="165" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850" y="165" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Build / test</text>

  <line x1="780" y1="250" x2="920" y2="315" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="850" y="270" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">An&#225;lise SAST</text>

  <line x1="780" y1="300" x2="920" y2="460" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="390" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Exporta m&#233;tricas</text>

  <text x="270" y="680" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-style="italic">Docker: slanko-app + slanko-db | Arquitetura em camadas (apresenta&#231;&#227;o, aplica&#231;&#227;o, dados, infraestrutura)</text>
</svg>
