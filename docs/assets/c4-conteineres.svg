<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img">
  <title>C4 N&#237;vel 2 - Diagrama de Cont&#234;ineres - Slanko</title>
  <desc>Cont&#234;ineres slanko-app (Next.js) e slanko-db (MySQL), com CI/CD, SonarCloud e monitoramento.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="780" fill="#ffffff"/>
  <text x="40" y="34" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13">C4 N&#237;vel 2 - Cont&#234;ineres | Slanko</text>

  <!-- Pessoas -->
  <rect x="40" y="170" width="160" height="80" rx="8" fill="#08427b"/>
  <text x="120" y="205" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gestor</text>
  <text x="120" y="228" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Pessoa]</text>

  <rect x="40" y="300" width="160" height="80" rx="8" fill="#08427b"/>
  <text x="120" y="335" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">T&#233;cnico</text>
  <text x="120" y="358" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Pessoa]</text>

  <!-- Boundary -->
  <rect x="250" y="70" width="600" height="580" rx="10" fill="#eef6fc" stroke="#1168bd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="270" y="100" fill="#1168bd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Slanko (limites do sistema)</text>

  <!-- slanko-app -->
  <rect x="300" y="130" width="480" height="270" rx="8" fill="#438dd5"/>
  <text x="540" y="168" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">slanko-app</text>
  <text x="540" y="190" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">[Container: Next.js / TypeScript / React]</text>
  <text x="540" y="225" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Camada de apresenta&#231;&#227;o (UI responsiva)</text>
  <text x="540" y="250" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">API REST interna (rotas Next.js)</text>
  <text x="540" y="275" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Regras de SLA e rentabilidade</text>
  <text x="540" y="300" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Valida&#231;&#227;o, autentica&#231;&#227;o JWT e autoriza&#231;&#227;o</text>
  <text x="540" y="325" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Prisma (acesso a dados)</text>
  <text x="540" y="360" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Apresenta&#231;&#227;o + aplica&#231;&#227;o no mesmo container</text>

