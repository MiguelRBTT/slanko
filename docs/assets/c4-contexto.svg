  <line x1="240" y1="395" x2="390" y2="340" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="300" y="385" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Usa (HTTPS / UI)</text>

  <line x1="710" y1="280" x2="860" y2="160" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="790" y="200" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">L&#234;/grava dados</text>

  <line x1="710" y1="305" x2="860" y2="305" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="785" y="295" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Build e testes</text>

  <line x1="710" y1="330" x2="860" y2="450" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="790" y="405" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">An&#225;lise de c&#243;digo</text>

  <line x1="550" y1="380" x2="550" y2="470" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="625" y="430" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">M&#233;tricas / logs</text>
