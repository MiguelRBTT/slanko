<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" width="1180" height="680" role="img">
  <title>C4 N&#237;vel 1 - Diagrama de Contexto - Slanko</title>
  <desc>Gestor e T&#233;cnico usam o Slanko. Persist&#234;ncia MySQL, CI/CD, SonarCloud e monitoramento.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
