global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: slanko-app
    metrics_path: /api/metrics
    static_configs:
      # Next.js rodando no host (npm run dev). No Docker Desktop (Windows/Mac) use host.docker.internal.
      - targets: ["host.docker.internal:3000"]
        labels:
          service: slanko-app
          env: local
