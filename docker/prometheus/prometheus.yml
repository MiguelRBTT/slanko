global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Next.js rodando no host com HTTPS local (npm run dev). No Docker Desktop (Windows/Mac) use host.docker.internal.
  - job_name: slanko-app
    metrics_path: /api/metrics
    scheme: https
    # Mesmo valor de METRICS_TOKEN no .env (valor de desenvolvimento local).
    authorization:
      credentials: slanko-local-metrics-token
    tls_config:
      # O certificado local (mkcert) é confiável no host, mas não dentro deste container.
      insecure_skip_verify: true
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: slanko-app
          env: local

  # App empacotada em container (docker compose --profile app up). Rede interna do compose, sem TLS.
  - job_name: slanko-app-container
    metrics_path: /api/metrics
    authorization:
      credentials: slanko-local-metrics-token
    static_configs:
      - targets: ["slanko-app:3000"]
        labels:
          service: slanko-app
          env: docker
