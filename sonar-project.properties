sonar.projectKey=MiguelRBTT_slanko
sonar.organization=miguelrbtt
sonar.projectName=Slanko

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/prisma/migrations/**,\
  **/*.css,\
  **/*.module.css

sonar.test.inclusions=tests/**/*.test.ts

# Coverage from Vitest (LCOV). UI/pages are analyzed for issues but excluded from coverage %.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  **/*.tsx,\
  **/*.css,\
  **/*.module.css,\
  src/app/**/layout.tsx,\
  src/app/**/page.tsx,\
  src/components/**,\
  src/lib/client/**,\
  prisma/**

sonar.typescript.tsconfigPath=tsconfig.json
